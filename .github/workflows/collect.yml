name: Collect AVESIS metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avesis-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: academics
          path: |
            data/academics.json
            data/collection-report.json
          if-no-files-found: error
