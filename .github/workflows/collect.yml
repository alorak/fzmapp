name: Collect AVESIS metadata
on:
  workflow_dispatch:
    inputs:
      discover_department:
        description: 'Discover department profiles (only if robots.txt permits)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: avesis-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
        env:
          DISCOVER_DEPARTMENT: ${{ inputs.discover_department }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: academics
          path: |
            data/academics.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-report
          path: data/collection-report.json
          if-no-files-found: warn
