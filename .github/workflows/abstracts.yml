name: Collect AVESIS thesis abstracts
on:
  workflow_dispatch:
  push:
    branches: ['abstracts/**']
    paths: ['scripts/abstracts.py', '.github/workflows/abstracts.yml']
permissions:
  contents: write
concurrency:
  group: avesis-collection
  cancel-in-progress: false
jobs:
  abstracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.abstracts
      # Commits data/abstracts.json to the branch the workflow ran on.
      - name: Commit abstracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abstracts.json
          if git diff --cached --quiet; then
            echo "No abstract changes"
          else
            git commit -m "Tez özetlerini AVESİS'ten güncelle"
            git push
          fi
