<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FZM | Akademik arama</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;color:#182433;background:#f5f7fa;margin:0}main{max-width:850px;margin:auto;padding:24px}section,article{background:white;border:1px solid #dce2ea;border-radius:12px;padding:20px;margin:12px 0}input,button{font:inherit;padding:12px;border:1px solid #ccd5df;border-radius:8px}input[type=search]{width:100%}button{background:#164e80;color:white;cursor:pointer}button:disabled{opacity:.5}small{color:#526172}a{color:#164e80}h1{font-size:26px}h2{font-size:19px}</style>
<main><h1>Akademik uzmanlık arama</h1><small>Ankara Üniversitesi · Fizik Mühendisliği</small><section><form id="search"><input id="q" type="search" required placeholder="Araştırma konusu (Türkçe veya İngilizce)"><p><button id="go">AI ile ara</button></p></form><p id="status" role="status">Veri yükleniyor…</p></section><div id="results"></div><section><h2>Veri yönetimi</h2><label>JSON içe aktar <input id="file" type="file" accept=".json,application/json"></label><p id="count"></p><button id="reset">Yerel veriyi sil</button></section></main>
<script type="module">
const $=id=>document.getElementById(id), status=$('status'), model='Xenova/multilingual-e5-small', version='e5-small-q8-v1';
let records=[], pipe, busy=false;
const db=await new Promise((ok,no)=>{let r=indexedDB.open('fzmapp',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
function read(k){return new Promise((ok,no)=>{let r=db.transaction('data').objectStore('data').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function write(k,v){return new Promise((ok,no)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}
function validate(a){if(!Array.isArray(a)||a.length>20000||!a.every(x=>x&&typeof x.faculty==='string'&&x.faculty.trim()&&typeof x.title==='string'&&x.title.trim()&&[x.abstract,x.url,x.kind].every(v=>v==null||typeof v==='string')))throw Error('Geçersiz JSON veri biçimi');return a.map(x=>({faculty:x.faculty,title:x.title,abstract:x.abstract||'',url:x.url||'',kind:x.kind||'publication'}))}
function update(){ $('count').textContent=records.length+' kayıt · '+new Set(records.map(x=>x.faculty)).size+' akademisyen';$('go').disabled=busy||!records.length;$('file').disabled=busy;$('reset').disabled=busy}
try{let saved=await read('records');records=validate(saved??await (await fetch('./data/academics.json')).json());status.textContent=records.length?'Aramaya hazır. İlk aramada model indirilecek.':'Veri yok; JSON içe aktarın.'}catch(e){status.textContent=e.message}update();
$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;let next=validate(JSON.parse(await f.text()));await write('records',next);records=next;status.textContent='Yerel veri kaydedildi.';$('results').replaceChildren();update()}catch(e){status.textContent=e.message}};
$('reset').onclick=async()=>{try{await new Promise((ok,no)=>{let t=db.transaction('data','readwrite');t.objectStore('data').clear();t.oncomplete=ok;t.onerror=()=>no(t.error)});records=[];$('results').replaceChildren();status.textContent='Yerel veri silindi. Yenileme ile başlangıç verisi yüklenir.';update()}catch(e){status.textContent=e.message}};
async function embed(text){let out=await pipe(text,{pooling:'mean',normalize:true});return Array.from(out.data)}
function dot(a,b){return a.reduce((s,x,i)=>s+x*b[i],0)}
function node(tag,text){let n=document.createElement(tag);n.textContent=text;return n}
$('search').onsubmit=async e=>{e.preventDefault();if(busy||!records.length)return;let q=$('q').value.trim();if(!q)return;busy=true;update();$('results').replaceChildren();try{if(!pipe){status.textContent='AI modeli yükleniyor…';let {pipeline}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');pipe=await pipeline('feature-extraction',model,{device:'wasm',dtype:'q8'})}let query=await embed('query: '+q),groups=new Map(),cache=await read('vectors');let signature=JSON.stringify(records);let vectors=cache?.version===version&&cache.signature===signature?cache.vectors:[];let fresh=vectors.length!==records.length;if(fresh)vectors=[];for(let i=0;i<records.length;i++){let r=records[i];if(fresh){status.textContent='İndeksleniyor: '+(i+1)+' / '+records.length;vectors.push(await embed('passage: '+r.title+' '+r.abstract))}let match={...r,score:dot(query,vectors[i])};if(!groups.has(r.faculty))groups.set(r.faculty,[]);groups.get(r.faculty).push(match)}if(fresh)await write('vectors',{version,signature,vectors});let sorted=Array.from(groups,([name,items])=>{items.sort((a,b)=>b.score-a.score);let top=items.slice(0,5);return {name,items,score:.6*top[0].score+.4*top.reduce((s,x)=>s+x.score,0)/top.length}}).sort((a,b)=>b.score-a.score);for(let g of sorted){let card=node('article','');card.append(node('h2',g.name),node('p','Benzerlik: '+g.score.toFixed(3)));for(let r of g.items.slice(0,3)){let p=node('p',r.title+' · '+r.score.toFixed(3));try{let u=new URL(r.url);if(u.protocol==='https:'){let a=node('a',' Kaynak');a.href=u.href;a.rel='noopener noreferrer';p.append(a)}}catch{}card.append(p)}$('results').append(card)}status.textContent='Sıralama tamamlandı. Skor uzmanlık olasılığı değildir.'}catch(e){status.textContent='Arama başarısız: '+e.message}finally{busy=false;update()}};
</script></html>
